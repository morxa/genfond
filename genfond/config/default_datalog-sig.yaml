# Same as default_datalog.yaml, but the pairwise separation constraint ranges over action
# signature classes instead of (instance, state, action) triples. Semantically identical;
# see solve_datalog_sig.lp. Config files do not chain, so this duplicates default_datalog.yaml.
policy_type: DATALOG
policy_iterations: 10
use_example_plans: true
frontier_expansion: true
abort_on_cycle: true
solve_prog: solve_datalog_sig.lp
emit_action_signatures: true
include_numerical_features: false
include_concepts: true
include_roles: true
include_actions: false
include_dead_states: false
include_goal_states: false
feature_generator:
  generate_concept_distance_numerical: false
  generate_count_numerical: false
  generate_til_c_role: true
