min_complexity: 2
max_complexity: 15
# Roles cost n*m^2 grounded values per state and concepts n*m, against n for plain features, so
# at high complexity roles dominate the ground program size (see docs/role-caps-results.md).
# These subtract from the per-round max_complexity to cap the concept/role complexity limits
# passed to dlplan's generate_features separately from the boolean/numerical limits, which stay
# at the full per-round complexity. The effective limit is max(1, complexity - offset), so an
# offset can never disable concepts/roles outright. 0 reproduces the previous behaviour, where
# all five limits are equal.
concept_complexity_offset: 0
role_complexity_offset: 0
# Adding an example plan or a dead end changes the state space. With this on, the complexity
# sweep restarts at min_complexity whenever that happens; the next plan is only added once the
# sweep has climbed back past the level the last one was added at.
#
# This does NOT change which policies are reachable. The feature pool at complexity c contains
# every feature of complexity < c, and the round right after a state-space change runs without
# min_feature_complexity, so a policy expressible at complexity 2 is found by the round at
# complexity 4 just as well -- and preferred, since the #minimize is over feature cost. What
# the restart changes is the cost of getting there: the low-complexity instances are far
# smaller, and they may still ground where the high-complexity one hits "Id out of range" or
# exhausts memory. So this trades a full re-sweep per added plan against a chance to succeed on
# a round whose larger instance cannot be grounded at all.
# Only has an effect with use_example_plans, which is what makes the state space grow.
reset_complexity_on_state_space_change: false
policy_iterations: 100
# How many times execute_policy runs each problem during *in-loop* validation --
# solve_iteratively's own testing block after every successful round, and the final
# cost-minimization pass's candidate comparisons -- as opposed to the one-time final
# verification loop in __main__, which keeps policy_iterations (see iterative_solver.
# _test_policy_on_problems). Repetition is only informative when execution samples among
# multiple applicable outcomes at random: FOND execution (execute_rule_policy) samples a
# successor among an action's nondeterministic outcomes, and the datalog executor
# (execute_datalog_policy) samples among applicable rule instantiations, so either can flake
# between runs of the identical policy on the identical problem. Deterministic executors that
# never branch this way gain nothing from repeating a run. Keeping this low (default 1, no
# repetition) is what makes in-loop validation cheap enough to run after every success on a
# large suite -- see docs/cheap-validation-results.md; a cluster run on the 141-problem spanner
# suite spent 8.5h in this test alone before this change. `default_datalog.yaml` and
# `default_datalog-sig.yaml` additionally lower policy_iterations itself (the *final*
# verification's repeat count) to 3, since for those deterministic-executor types even the
# final, one-time verification gains little from policy_iterations' default of 100 -- see the
# comment there.
validation_iterations: 1
# In-loop validation tests problems in the same smallest-first order solve_iteratively sorts
# `problems` into once at the top of the run. Stop testing a candidate policy after this many
# problems *in a row* fail, instead of testing every remaining (typically larger, so likelier to
# also fail) problem in the suite. The returned solved count is then a lower bound rather than
# the exact number the policy solves; keep_best_policy's round-to-round comparison treats that
# lower bound as the count, which is sound as long as it is applied consistently (see its own
# config comment) -- the exact count is always recomputed once, unbounded, by the final
# verification loop in __main__. null tests every problem regardless of failures, reproducing
# the previous (unbounded) behaviour. The final cost-minimization pass's own candidate testing
# does not use this: it compares candidates by how many problems they solve, so truncating that
# count would bias the comparison (see _test_policy_on_problems's docstring).
validation_max_consecutive_failures: 3
# Wall-clock budget in seconds for a single execute_policy call during in-loop validation (both
# solve_iteratively's own testing block and the final cost-minimization pass's candidate tests).
# A problem that runs past it counts as a failure of that problem (ExecutionTimeout, a
# RuntimeError subclass, so it is caught by every existing `except RuntimeError:` around
# execute_policy without other changes). Enforced by a monotonic-clock deadline checked once per
# step inside execute_rule_policy's/execute_datalog_policy's own execution loop, not by a
# signal-based interrupt: execution always runs in-process on the caller's thread, and
# policy_steps (a step *count*) cannot substitute for a wall-clock bound, since a single step is
# not itself time-bounded (e.g. enumerating action/object combinations). null = unbounded
# (previous behaviour). Only applies to in-loop validation; the final verification loop in
# __main__ never passes a time_limit.
validation_time_limit: 60
# Seed for the global RNG. Policy execution is randomized -- rules are tried in a random order,
# object bindings are shuffled, and successors are drawn at random -- so the number of solved
# problems varies between runs of the *same* policy: a problem counts as solved only if all
# policy_iterations attempts succeed, and a borderline one flakes. Set this for any run that
# has to be compared against another. null keeps the unseeded behaviour.
seed: null
abort_on_cycle: false
stop_after_first_solution: true
policy_steps: 10000
use_example_plans: false
min_number_of_plans: 5
# Hard cap on the number of example plans (from min_number_of_plans, INC_PLANS, or frontier
# expansion) a single problem may accumulate; null (default) is unbounded, reproducing the
# previous behaviour exactly. Runaway plan accumulation through frontier expansion has been
# observed to reach four figures on a single problem (see docs/plan-cap-results.md), each one
# adding states to that problem's StateSpaceGraph and facts to the ASP instance, so a very large
# count is a symptom of the solver spinning rather than making progress. The cap only stops
# further growth from INC_PLANS and frontier expansion -- the initial min_number_of_plans batch
# is a deliberate floor, not runaway growth, so it is exempt; a problem may start out above the
# cap if min_number_of_plans is set higher than it.
max_plans_per_problem: null
planner: siw
planners:
  topk_planner:
    number_of_plans: 10
  siw:
    # "iw" runs plain iterated width on the whole problem; it also requires branch: false
    algorithm: siw
    max_width: 2
    prune: true
    # Diverse plans by branching over SIW's serializations; requires algorithm: siw
    branch: true
    # Additional runs with permuted action and candidate goal orders. This is an outer loop:
    # restart 2 only starts once the branching search of restart 1 is exhausted.
    restarts: 5
    seed: 0
    # Keep this off: it is the mechanism that searches past max_width
    explore_widths: false
    # null uses SIW's own default: unbounded, or 10^7 generated states if branch is on
    max_nodes: null
num_threads: null
max_memory: null
# How clingo optimises the #minimize over selected feature/concept/role complexity.
# "bb" is clingo's own default: branch and bound, i.e. find a model, add the constraint that
# the next one must be cheaper, repeat. It produces a stream of improving models, so it is the
# strategy that gives an anytime solve something to keep, but on the hitting-set constraints of
# the signature encoding it can spend hours proving that its last model is optimal.
# "usc" is core-guided (unsatisfiable-core) optimisation: it raises a lower bound by extracting
# cores instead of lowering an upper bound, and returns a model only once the two meet. That
# often settles instances bb cannot close, but under a time budget it is all-or-nothing --
# cancelled early it usually has no model at all. Qualified forms ("usc,oll", "bb,dec", ...)
# are passed through verbatim.
clingo_opt_strategy: bb
# Extra raw clingo command-line options for the Control, e.g. ["--opt-usc-shrink=min",
# "--heuristic=Domain"]. Experimental knob; nothing in the code inspects them.
clingo_options: []
# Wall-clock budget in seconds for a *single* clingo solve (one lazy-pair iteration counts as
# one solve). null leaves the solve unbounded, which is the previous behaviour exactly. With a
# budget the solve becomes anytime: it is cancelled when the budget is up and the best model
# seen so far is kept. Such a model is still a valid policy -- it satisfies every constraint --
# but its cost is only an upper bound, so the round no longer refutes its complexity level.
solve_time_limit: null
# Wall-clock budget in seconds for the *whole run*. null (default) leaves it unbounded -- the
# previous behaviour exactly. The budget is laid out, earliest deadline first, as:
#
#   |<---------------------------- max_wall_time ---------------------------->|
#   |<--- round loop --->|<--- final cost-min. pass --->|<--- wall_time_reserve --->|
#   0                 wall_deadline               final_pass_deadline        max_wall_time
#                  (= final_pass_deadline               (= max_wall_time -
#                   - final_pass_budget,                  wall_time_reserve)
#                   only when the pass
#                   is enabled; else
#                   = final_pass_deadline)
#
# `wall_time_reserve` is time kept back from *both* phases above for __main__'s own final
# evaluation (pickle the policy, verify it on every problem, write the stats row -- unbounded,
# runs after solve_iteratively returns). `solve_iteratively`'s round loop stops starting new
# rounds and cuts off a round already in flight (Solver.wall_deadline, composing with
# solve_time_limit as whichever is sooner) once it reaches `wall_deadline`, then returns
# normally with the last successful policy (if any) so __main__ proceeds exactly as on a normal
# end -- with an extra stoppedBy=wall_time (or =signal, see SIGTERM below) column and
# wallBudgetUsed. Exists because a cluster job killed by the SLURM time limit writes neither a
# policy nor a stats row, and loses whatever round or clingo solve was in progress. SIGTERM
# (which SLURM sends ahead of the hard kill; see genfond.bash's --signal=B:TERM@600) and SIGINT
# trigger the identical graceful stop independently of this setting. See
# docs/wall-budget-results.md.
#
# When final_cost_minimization (below) is enabled together with add_problem_after_success (its
# only non-no-op combination), the round loop's own `wall_deadline` is narrowed by
# final_pass_budget seconds, so it stops that much earlier than final_pass_deadline and
# guarantees the pass a budget of its own; the pass itself respects final_pass_deadline (see
# final_pass_min_time and _final_cost_minimization_pass's docstring). Without the pass enabled,
# wall_deadline == final_pass_deadline, reproducing the previous two-phase (loop, then
# __main__) layout exactly.
max_wall_time: null
# How much of max_wall_time to hold back for __main__'s own final evaluation, after both the
# round loop and (if enabled) the final cost-minimization pass are done. Only has an effect
# together with max_wall_time.
wall_time_reserve: 300
# How much of max_wall_time to reserve for the final cost-minimization pass (below), by stopping
# the round loop that much earlier than it otherwise would. Only has an effect together with
# max_wall_time, final_cost_minimization and add_problem_after_success -- the pass's only
# non-no-op combination. The pass is what improves generalisation (see
# docs/final-climb-results.md), so it is given a guaranteed slice of the budget instead of
# whatever happens to be left over once the round loop has already run right up to
# max_wall_time - wall_time_reserve.
final_pass_budget: 1800
dump_failed_policies: false
dump_clingo_program: null
keep_going: false
continue_after_error: false
include_boolean_features: true
include_numerical_features: true
include_concepts: false
include_roles: false
include_actions: false
include_action_params: false
include_pristine_states: true
# Emit asig/4 and the sig_* facts that let the datalog separation constraint range over action
# signature classes rather than (instance, state, action) triples. See solve_datalog_sig.lp.
emit_action_signatures: false
# Emit c_eval/4, r_eval/5, aparam/3 and aname/2 -- one fact per (state, concept|role, action
# argument [pair]) and one per (state, action). solve_datalog.lp (and the datalog-actions /
# datalog-action-params variants) read these back out of the model, so they stay on there. With
# emit_action_signatures the separation layer is reconstructed in Python from the same dlplan
# evaluations instead (see action_signatures.py), and solve_datalog_sig.lp never references
# these four predicates at all, so default_datalog-sig.yaml turns this off: on a 7-block
# blocks3ops instance these were the dominant ground atoms (n*|C|*m and n*|R|*m^2) for facts
# nothing consumed. See docs/lean-facts-results.md.
emit_object_facts: true
# Add the pairwise separation constraints of the signature encoding lazily, one batch of
# violated pairs per solve, instead of emitting all of them in the instance. Only meaningful
# together with emit_action_signatures. See lazy_pairs.py.
lazy_pairs: false
# How many violated pairs one lazy iteration may add (the smallest distinguishing sets first).
lazy_pairs_batch: 5000
# Compute, before the search, which (instance, state, action) occurrences are good in every
# model and which are bad in every model, and pin them: the forced-bad ones are dropped from the
# good_trans choice and the forced-good ones get a constraint (solve_datalog_sig.lp only; needs
# emit_action_signatures). A transition into a state that is neither alive nor pruned can never
# be good, a bad signature class makes every occurrence of that class bad wherever it occurs, a
# state whose surviving candidates all share one class forces that class good, and a good class
# makes all its occurrences good -- run to a fixpoint (see forced_labels.py for the soundness
# argument). With lazy_pairs this also seeds batch 0 of the lazy loop with the pairs between a
# forced-good and a forced-bad class, which constrain every model and therefore need no
# counterexample. false (default) reproduces the previous ground program exactly.
fix_forced_labels: false
# Bias clingo's decision heuristic towards labelling the transitions that lie on an example plan
# good (a #heuristic directive plus --heuristic=Domain; solve_datalog_sig.lp only, and only
# meaningful with use_example_plans). Search order only -- the models and the optimum are
# unchanged. Independent of fix_forced_labels.
plan_label_heuristic: false
# Occam bias for the signature-quotiented encoding (solve_datalog_sig.lp only; a no-op for
# every other solve_prog): whether to additionally minimize the number of good signature
# classes selected. A datalog rule is the projection of one good signature onto the selected
# elements, so every good signature beyond the minimum needed to cover the alive states (the
# solver must select >= 1 good transition per alive non-goal state, but may select more) adds a
# rule that only fits the training states it was picked for. "none" (default) reproduces the
# previous behaviour byte-for-byte. "below" adds the minimize at a lower priority than the
# feature/concept/role complexity minimize, so it only breaks ties between equal-cost policies.
# "above" adds it at a higher priority, so fewest good signatures is decided first and feature
# cost only breaks ties -- this changes which policy is optimal, not just which one wins a tie.
# Both keep the frontier-transition count (solve_datalog_sig.lp's highest `#minimize` priority)
# the highest priority. See docs/min-rules-results.md.
minimize_good_signatures: none
# Occam bias for the signature-quotiented encoding (solve_datalog_sig.lp only; a no-op for
# every other solve_prog): whether to minimize the *number* of selected concepts/features/roles
# instead of only their total complexity. A hand-picked pool with fewer, more general selected
# elements generalizes far better than the solver's own cost-minimal choice, which tends to
# prefer several cheap, narrow elements over one more expensive general one -- and every element
# beyond what generalizes grows the number of distinguishable object classes, and hence the
# number of rules, exponentially. "none" (default) reproduces the previous behaviour byte-for-
# byte. "below" adds the minimize at a lower priority than the feature/concept/role complexity
# minimize, so it only breaks ties between equal-cost policies. "above" adds it at a higher
# priority, so fewest selected elements is decided first and feature cost only breaks ties --
# this changes which policy is optimal, not just which one wins a tie. Composes freely with
# minimize_good_signatures (independent priority levels; see solve_datalog_sig.lp). Both keep
# the frontier-transition count the highest priority. See docs/min-count-results.md.
minimize_selected_count: none
include_dead_states: true
include_goal_states: true
preset_features: null
# Hand-given booleans/numericals/concepts/roles (same shape as preset_features: lists of
# DLPlan strings) that are always in the pool, in addition to whatever the round's synthesis
# produces. Unlike preset_features, this does not replace synthesis. Elements are parsed with
# the factory and appended to the synthesised lists after generate_features runs, before
# pruning, so they are exempt from the round's max_complexity/concept_complexity_offset/
# role_complexity_offset limits (those are only enforced inside generate_features) but still go
# through compute_uninformative_*/compute_redundant_* like every synthesised element, and keep
# DLPlan's own computed complexity for the #minimize over feature cost. Deduplicated against the
# synthesised lists (and against each other) by string representation. If preset_features is
# also set, extra_features is merged into the preset lists instead (preset_features already
# replaces synthesis, so there is nothing to append after). null (default) is a no-op. See
# docs/extra-features-results.md.
extra_features: null
# When set to an integer, every element listed in extra_features is emitted with this complexity
# in the feature_complexity/concept_complexity/role_complexity facts instead of DLPlan's own
# compute_complexity() -- only the emitted cost changes, nothing else about how the element is
# generated, deduplicated or pruned. Lets a hand-given element that generalizes well compete with
# cheap synthesised combinations in the #minimize over feature cost, rather than losing on
# syntactic cost it was never meant to be judged by. null (default) keeps DLPlan's computed
# complexity, as before. No effect without extra_features set. See docs/extra-features-results.md.
extra_features_complexity: null
feature_generator:
  generate_til_c_role: false
prune_roles: true
prune_concepts: true
prune_features: true
prune_static_concepts: false
prune_static_roles: false
prune_redundant_features: true
prune_redundant_concepts: true
prune_redundant_roles: true
use_selected_states: false
# Let the solver select transitions into unexpanded ("frontier") states at a cost, then feed
# those states back to the planner and re-solve. Only meaningful with use_example_plans.
frontier_expansion: false
# Loop guard: total number of frontier expansion rounds per run.
max_frontier_expansions: 20
# How many frontier states to expand per round; 0 expands all the solver selected.
max_frontier_states_per_round: 0
# Hard cap on frontier transitions in a single model (-> limit_prune_cost); null = unbounded.
max_frontier_transitions: null
use_unrestricted_features: false
# After a successful round, the default is to climb feature complexity (and cycle through
# example plans / unrestricted features) on the *same* training set until max_cost <=
# complexity or max_complexity is reached, before adding the next unsolved problem. On domains
# where grounding is the bottleneck (e.g. blocks3ops), that climb re-runs the largest training
# set so far at complexities that were never needed to find a policy, and those are exactly the
# rounds that run out of memory or hit clingo's 32-bit ground-fact id ceiling. With this on, a
# successful round adds the next unsolved problem immediately instead, skipping the climb.
add_problem_after_success: false
# Only meaningful together with add_problem_after_success (a no-op otherwise, since the normal
# ladder already climbs complexity whenever a round is not an immediate success). Skipping the
# climb after every success means a chain of successes that solves every problem in a row never
# minimizes feature cost at all -- the final policy is priced at whatever complexity first
# solved the final training set, not the cheapest complexity that does, and a cheaper policy has
# been observed to generalize better (see the c-base vs. c-combo rows in
# docs/experiments-log.md and their "Caution on reading these two rows" paragraph). With this
# on, once the run has nothing left to add (every problem solved, so the main loop's
# stop_after_first_solution break fires without ever climbing), it runs the old climb exactly
# once more on the frozen final training set -- see docs/final-climb-results.md.
final_cost_minimization: false
# Only meaningful with final_cost_minimization and max_wall_time both set. If the round loop
# already stopped because it ran out of wall-clock budget (stoppedBy == "wall_time"), the pass
# is skipped outright -- rather than started only to immediately hit its own deadline -- unless
# at least this many seconds remain before final_pass_deadline (max_wall_time -
# wall_time_reserve). Not applied when the loop stopped for any other reason (every problem
# solved, or the ladder exhausted its own escalation branches): then any remaining time, however
# little, is better spent attempting a round than not. See
# _final_cost_minimization_pass's docstring; a skipped pass is recorded as
# stats["finalPassSkipped"] with the reason.
final_pass_min_time: 600
# Only meaningful together with final_cost_minimization. Caps the number of complexity levels the
# pass tries above succ_complexity (the complexity its starting policy was found at), regardless
# of how far max_cost/max_complexity would otherwise let it climb. The pass is meant to find a
# *cheaper* policy near the one the main loop already found, not to explore the whole ladder: a
# cluster run on blocks3ops climbed unbounded all the way to a pool of 1,945 features / 5,738
# concepts before a single solve_step call exceeded any budget and the job died. null reproduces
# the previous unbounded behaviour. Reported as stats["finalPassLevelsTried"] (== the number of
# rounds actually run, capped by this). See _final_cost_minimization_pass's docstring.
final_pass_max_levels: 2
# Only meaningful together with final_cost_minimization; no CLI flag (config file only). Skips an
# individual pass round -- without grounding it at all -- when the pool FeaturePool builds for
# that round (features + concepts + roles) exceeds this many elements, logging the skip and
# recording stats["poolSizeSkipped"]. Grounding and solving a large pool, not building it, is
# what actually exhausts memory, so the check happens after the (comparatively cheap) pool is
# built but before to_clingo()/Solver.solve(). A skipped round is treated like an ordinary
# NO_SOLUTION round (the pass keeps climbing), so this composes with final_pass_max_levels rather
# than replacing it. null (default) means no limit -- the previous behaviour.
final_pass_max_pool: null
# Track the best policy the whole run sees -- by (problems solved on the full problem list, then
# lower feature cost) -- and return/save that instead of whatever policy the loop happens to end
# on. Every successful round is already tested on all problems inside the loop (that test no
# longer stops at the first miss while this is on, so the coverage count is exact), so this is
# free bookkeeping. Without it, add_problem_after_success can grow the training set past the
# point where a policy generalizes: a policy learned early from a small set can already solve
# nearly everything, but the loop keeps going on a handful of holdouts and later policies --
# patchworks fitted to the larger, harder set -- can solve far fewer problems overall, and the
# old code discarded the early one anyway. Also applied to the final cost-minimization pass's
# result, if that runs. Reported as stats["bestSolved"]/["bestCost"]/["bestRound"] (the round the
# best policy came from, or "final_pass") and stats["lastSolved"] (what the run would have
# returned without this). false restores the old behaviour: always return the last policy, and
# the in-loop test stops at the first problem it cannot solve again.
keep_best_policy: true
unselect_problems: false
visualize_state_graphs: false
unrestricted_feature_generator:
  generate_empty_boolean: true
  generate_inclusion_boolean: true
  generate_nullary_boolean: true
  generate_all_concept: true
  generate_and_concept: true
  generate_bot_concept: true
  generate_diff_concept: true
  generate_equal_concept: true
  generate_not_concept: true
  generate_one_of_concept: true
  generate_or_concept: true
  generate_primitive_concept: true
  generate_projection_concept: true
  generate_some_concept: true
  generate_subset_concept: true
  generate_top_concept: true
  generate_concept_distance_numerical: true
  generate_count_numerical: true
  generate_and_role: true
  generate_compose_role: true
  generate_diff_role: true
  generate_identity_role: true
  generate_inverse_role: true
  generate_not_role: true
  generate_or_role: true
  generate_primitive_role: true
  generate_restrict_role: true
  generate_til_c_role: true
  generate_top_role: true
  generate_transitive_closure_role: true
  generate_transitive_reflexive_closure_role: true
log:
  execution: CRITICAL
